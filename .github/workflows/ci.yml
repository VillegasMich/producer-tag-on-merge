name: CI

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: Push the image to Docker Hub (only on a release tag, e.g. v1.2.3)
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt, clippy, tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      # Unit tests + tests/cli.rs (offline, PLAYER=none). The live API tests skip themselves.
      - run: cargo test --locked
      - name: shellcheck
        if: runner.os == 'Linux'
        run: shellcheck scripts/*.sh

  docker:
    # PRs and pushes: build + smoke test + dry-run push (tags computed, nothing uploaded).
    # Published releases, and manual runs on a v* tag with `publish` (how release.yml publishes,
    # since its GITHUB_TOKEN release fires no event): the same, then amd64/arm64 push to Docker Hub.
    name: Docker image (smoke test, push on release)
    needs: test
    runs-on: ubuntu-latest
    env:
      PUBLISH: ${{ github.event_name == 'release' || (inputs.publish == true && startsWith(github.ref, 'refs/tags/v')) }}
      # Docker Hub repository, e.g. "johndoe/producer-tag-on-merge". See docs/repository-setup.md.
      IMAGE: ${{ vars.DOCKERHUB_IMAGE || format('{0}/producer-tag-on-merge', vars.DOCKERHUB_USERNAME || 'local') }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        if: env.PUBLISH == 'true'
      - uses: docker/setup-buildx-action@v3
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # Releases: 1.2.3, 1.2 and latest (latest is skipped for pre-releases).
          # Otherwise: pr-<n>, branch name and sha-<short>, which are never pushed.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=pr
            type=ref,event=branch
            type=sha
      - name: Build image (linux/amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: producer-tag-on-merge:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        # No audio device on the runner: --silent logs instead of playing. Two merges through
        # the real pipeline must both resolve the mounted tag.
        run: |
          docker run --rm producer-tag-on-merge:ci --version
          out=$(docker run --rm \
            --mount "type=bind,source=$PWD/assets/sample-tag.wav,target=/tags/default.wav,readonly" \
            producer-tag-on-merge:ci simulate --silent --count 2)
          echo "$out"
          [ "$(grep -c 'would play' <<<"$out")" -eq 2 ]
      - name: Dry-run push
        if: env.PUBLISH != 'true'
        run: |
          {
            echo "### Docker push (dry run)"
            echo "Nothing was pushed. Tags this build would get (releases get version tags + latest):"
            echo '```'
            echo "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$TAGS"
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
      - name: Check Docker Hub settings
        if: env.PUBLISH == 'true'
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::Set the DOCKERHUB_USERNAME variable and DOCKERHUB_TOKEN secret (docs/repository-setup.md)"
            exit 1
          fi
      - uses: docker/login-action@v3
        if: env.PUBLISH == 'true'
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push (linux/amd64, linux/arm64)
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e:
    name: Live API tests (read-only)
    needs: test
    # Secrets are not available to PRs from forks; run on main, releases and manual runs only.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      # Personal access tokens with read scopes only; see docs/repository-setup.md. The built-in
      # GITHUB_TOKEN can't be used: it is an app token and GET /user rejects it.
      GITHUB_TOKEN: ${{ secrets.E2E_GITHUB_TOKEN }}
      GITLAB_TOKEN: ${{ secrets.E2E_GITLAB_TOKEN }}
      GITLAB_URL: ${{ vars.E2E_GITLAB_URL }}
    steps:
      - name: Skip without tokens
        if: env.GITHUB_TOKEN == '' && env.GITLAB_TOKEN == ''
        run: echo "::notice::E2E_GITHUB_TOKEN / E2E_GITLAB_TOKEN secrets not set; skipping live API tests"
      - uses: actions/checkout@v4
        if: env.GITHUB_TOKEN != '' || env.GITLAB_TOKEN != ''
      - uses: dtolnay/rust-toolchain@stable
        if: env.GITHUB_TOKEN != '' || env.GITLAB_TOKEN != ''
      - uses: Swatinem/rust-cache@v2
        if: env.GITHUB_TOKEN != '' || env.GITLAB_TOKEN != ''
      - name: GitHub
        if: env.GITHUB_TOKEN != ''
        run: cargo test --locked --test e2e github -- --nocapture
        env:
          E2E_GITHUB: "1"
      - name: GitLab
        if: env.GITLAB_TOKEN != ''
        run: cargo test --locked --test e2e gitlab -- --nocapture
        env:
          E2E_GITLAB: "1"
